<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Meaning Ladder</title>
  <!-- GitHub Pages serves this for any address that doesn't exist (a typo, an
       old link). Instead of GitHub's error page, send people to the game. -->
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta http-equiv="refresh" content="2; url=/">
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
           text-align: center; background: #f8f3ea; color: #3b332d;
           font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #a65f42; font-weight: 700; }
    @media (prefers-color-scheme: dark) { body { background: #1d1a17; color: #efe6da; } a { color: #e39573; } }
  </style>
</head>
<body>
  <p>That page doesn't exist. Taking you to <a href="/">today's ladder</a>…</p>
</body>
</html>
