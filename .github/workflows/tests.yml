# Runs the Python and JavaScript test suites on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements-ci.txt
          python -m nltk.downloader -q wordnet omw-1.4 stopwords

      - name: Python tests
        run: pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: JavaScript tests
        run: node --test "tests/js/*.test.mjs"
