# Runs the Python and JavaScript test suites on every push and pull request.
# Uses `pull_request` (not `pull_request_target`), so pull requests from forks
# run with a read-only token and no access to secrets.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements-ci.txt
          python -m nltk.downloader -q wordnet omw-1.4 stopwords

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The same command you run locally, so the Makefile can't drift from CI.
      # PY=python: CI installs packages globally instead of in a .venv.
      - name: Audits + Python + JavaScript tests
        run: make check PY=python
