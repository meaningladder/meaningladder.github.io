# Publishes the static site to GitHub Pages.
# Runs on every push to main, on demand, and at the end of the daily puzzle job.
# Actions are pinned to commit SHAs; see the note in daily-puzzle.yml.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called from the daily job, the triggering commit is the one
          # BEFORE the new puzzles were pushed. Check out the branch tip instead.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Collect site files
        # Only what the browser needs: no scripts/, tests/ or lists/.
        run: |
          mkdir _site
          cp -r index.html style.css js data assets puzzle_config.json sitemap.xml robots.txt _site/
          if [ -d puzzles ]; then cp -r puzzles _site/; fi
          du -sh _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
