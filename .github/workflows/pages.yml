# Publishes the static site to GitHub Pages.
# Runs on every push to main, on demand, and at the end of the daily puzzle job.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # When called from the daily job, the triggering commit is the one
          # BEFORE the new puzzles were pushed. Check out the branch tip instead.
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect site files
        # Only what the browser needs: no scripts/, tests/ or lists/.
        run: |
          mkdir _site
          cp -r index.html style.css js data puzzle_config.json _site/
          if [ -d puzzles ]; then cp -r puzzles _site/; fi
          du -sh _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
